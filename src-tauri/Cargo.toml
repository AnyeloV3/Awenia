[package]
name = "awenia"
version = "4.0.0"
description = "Awenia - administración local para emprendimiento de crochet"
authors = ["Awenia"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "awenia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
